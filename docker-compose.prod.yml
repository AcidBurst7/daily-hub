services:

  web:
    image: dailyhub:latest
    build: .
    container_name: dailyhub_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: dailyhub_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: dailyhub_redis

  celery:
    build: .
    command: celery -A config worker -l info
    container_name: dailyhub_celery
    depends_on:
      - redis
      - postgres
    env_file:
      - .env

  celery-beat:
    image: dailyhub:latest
    container_name: dailyhub_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    
  nginx:
    image: nginx:latest
    container_name: dailyhub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      web:
        condition: service_healthy


volumes:
  postgres_data:
