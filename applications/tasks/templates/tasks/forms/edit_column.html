{% extends 'base.html' %}
{% load static %}
{%block title %}Редактирование доски{% endblock %}
{% block content %}
<div class="page-body">
    <div class="container-xl">
        <div class="row row-cards">
            <form id="createBoardForm" method="post" class="card">
                {% csrf_token %}

                <div class="card-header">
                    <h3 class="card-title">Редактирование колонки</h3>
                </div>

                <div class="card-body">
                    <div class="mb-3">
                        <p>{{ edit_column_form.name.label }}</p>
                        {{ edit_column_form.name }}
                    </div>
                </div>

                <div class="card-footer text-end">
                    <div class="mb-3">
                        <a href="{% url 'tasks:index' %}" class="btn btn-link link-secondary btn-3"> Выход </a>
                        <button type="submit" class="btn btn-primary btn-5 ms-auto">
                            <!-- Download SVG icon from http://tabler.io/icons/icon/plus -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-2">
                                <path d="M12 5l0 14"></path>
                                <path d="M5 12l14 0"></path>
                            </svg>
                            Сохранить изменения
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
