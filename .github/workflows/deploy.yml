name: Deploy Dailyhub

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd /home/dailyhub

            git fetch origin
            git reset --hard origin/master

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build

            docker image prune -f