services:

  web:
    build: .
    container_name: dailyhub_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: dailyhub_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8-alpine
    container_name: dailyhub_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: dailyhub_celery
    command: celery -A config worker -l info
    depends_on:
      - redis
      - postgres
      - rabbitmq
    env_file:
      - .env

  celery-beat:
    build: .
    container_name: dailyhub_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  nginx:
    image: nginx:latest
    container_name: dailyhub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dailyhub_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
  postgres_data:
